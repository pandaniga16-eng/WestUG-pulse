/* Full-bleed cover, with the embedded YouTube player unobstructed. */

.row.feature-grid{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;align-items:start;padding-bottom:8px}
.row.feature-grid::-webkit-scrollbar,.content-shelf::-webkit-scrollbar{display:none}
.row.feature-grid>.po,.row.feature-grid>.explore-card{flex:0 0 clamp(132px,38vw,184px);scroll-snap-align:start}
.po{text-align:left}.poster-title{display:block;color:#fff;font-size:13px;line-height:1.3;margin:7px 0 0;overflow-wrap:anywhere}
.pi{border-radius:12px;aspect-ratio:3/4.1}
.shelf-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;margin:23px 0 10px}
.shelf-heading h3{font-size:19px;line-height:1.2}.shelf-heading button{color:var(--y);font-weight:600;font-size:13px;min-height:44px}.shelf-heading span{font-size:11px;color:var(--mute)}
.content-shelf{display:flex;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:0 20px 8px;scrollbar-width:none}
.content-shelf>.po{flex:0 0 clamp(132px,38vw,184px);scroll-snap-align:start}
.category-shelf{margin-top:6px}.video-pages{justify-content:flex-start}.video-pages button{color:var(--y)}


/* Expanded category view: all videos are visible in a responsive grid. */
.all-videos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;padding:0 20px 8px;align-items:start}
@media(min-width:600px){.all-videos{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:900px){.all-videos{grid-template-columns:repeat(4,minmax(0,1fr))}}


/* Continue Watching */
.cw-shelf>.cw-card{flex:0 0 clamp(132px,38vw,184px);min-width:0;scroll-snap-align:start}.cw-card .po{width:100%}.cw-track{height:4px;background:#464650;border-radius:4px;overflow:hidden;margin-top:8px}.cw-track span{display:block;height:100%;background:var(--y)}.cw-card>small{display:block;color:var(--mute);font-size:11px;margin-top:5px}.cw-remove{font-size:12px;color:var(--y);min-height:40px;text-decoration:underline}.shelf-heading h2{font-size:19px;line-height:1.2}
</style>

// Continue Watching: only recorded, seekable video; never a view-history placeholder.
const CW_KEY='westpulse.continue.v1', CW_LIMIT=30;
let cwActive=null;
function cwRead(){
  try { const x=JSON.parse(localStorage.getItem(CW_KEY)||'[]'); return Array.isArray(x)?x.filter(r=>r && typeof r.id==='string' && Number.isFinite(r.time) && Number.isFinite(r.duration) && Number.isFinite(r.updated) && r.time>=5 && r.duration>0 && r.time/r.duration<0.95).slice(0,CW_LIMIT):[]; } catch(e){return []}
}
function cwWrite(rows){try{localStorage.setItem(CW_KEY,JSON.stringify(rows.slice(0,CW_LIMIT)));return true}catch(e){return false}}
function cwId(k,c){
  if(!['c','a','p','e'].includes(k[0]) || c.hls || c.channelId || c.frame || c.social || c.embed || c.external)return '';
  if(c.video)return 'video:'+c.video;
  if(c.youtube)return 'youtube:'+c.youtube;
  return '';
}
function cwRecord(id,time,duration){
  if(!id||!Number.isFinite(time)||!Number.isFinite(duration)||duration<=0)return;
  const rows=cwRead().filter(r=>r.id!==id);
  if(time/duration>=0.95){cwWrite(rows);return}
  if(time>=5)cwWrite([{id,time,duration,updated:Date.now()},...rows]);
  else cwWrite(rows);
}
function cwRemove(id){cwWrite(cwRead().filter(r=>r.id!==id))}
function cwResolve(id){
  for(const type of ['c','a','p','e']){
    const arr=SRC[type]||[];
    for(let i=0;i<arr.length;i++){const k=type+i;if(cwId(k,arr[i])===id)return {k,c:arr[i]}}
  }
  return null;
}
function cwShelf(){
  const rows=cwRead().sort((a,b)=>b.updated-a.updated).map(r=>({r,item:cwResolve(r.id)})).filter(x=>x.item);
  if(!rows.length)return '';
  return `<section aria-label="Continue watching"><div class="shelf-heading"><h2>Continue Watching</h2><span>Saved on this device</span></div><div class="content-shelf cw-shelf">${rows.map(({r,item})=>`<div class="cw-card">${poster(item.c,item.k)}<div class="cw-track" role="progressbar" aria-label="Playback progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.floor(100*r.time/r.duration)}"><span style="width:${Math.floor(100*r.time/r.duration)}%"></span></div><small>${Math.floor(r.time/60)}:${String(Math.floor(r.time%60)).padStart(2,'0')} watched</small><button class="cw-remove" data-cw-remove="${encodeURIComponent(r.id)}" aria-label="Remove from Continue Watching">Remove</button></div>`).join('')}</div></section>`;
}
function cwRefresh(){const el=document.querySelector('#cw-shelf');if(el)el.innerHTML=cwShelf()}
function cwStop(){if(cwActive){const active=cwActive;cwActive=null;active.stop()}}
function cwVideo(id,video,session){
  if(!id)return;
  const saved=cwRead().find(r=>r.id===id);let played=false, restored=!saved;
  const restore=()=>{if(restored||session!==playerSession)return;try{if(video.seekable.length && saved.time<video.duration*0.95){video.currentTime=saved.time;restored=true}}catch(e){}};
  const save=()=>{if(session!==playerSession||!played||!restored||!video.seekable.length)return;cwRecord(id,video.currentTime,video.duration)};
  video.addEventListener('loadedmetadata',restore);video.addEventListener('canplay',restore);
  video.addEventListener('playing',()=>{played=true;restore()});
  video.addEventListener('pause',save);video.addEventListener('seeked',save);
  video.addEventListener('ended',()=>{if(session===playerSession)cwRemove(id)});
  const timer=setInterval(save,2000);cwActive={flush:save,stop(){save();clearInterval(timer)}};
}
function cwYoutube(id,session){
  if(!id)return null;
  const saved=cwRead().find(r=>r.id===id);let player=null,played=false,restored=!saved;
  const save=()=>{try{if(session!==playerSession||!played||!restored||!player)return;const d=player.getVideoData&&player.getVideoData();if(d&&d.isLive)return;cwRecord(id,player.getCurrentTime(),player.getDuration())}catch(e){}};
  const timer=setInterval(save,2000);
  const obj={saved,ready(p){player=p;if(saved){try{p.seekTo(saved.time,true);restored=true}catch(e){}}},state(e){if(e.data===YT.PlayerState.PLAYING)played=true;else if(e.data===YT.PlayerState.ENDED){played=false;cwRemove(id)}else if(e.data===YT.PlayerState.PAUSED)save()},error(code){if([100,101,150].includes(code)){played=false;cwRemove(id)}},flush:save,stop(){save();clearInterval(timer)}};
  cwActive=obj;return obj;
}
window.addEventListener('pagehide',()=>{if(cwActive)cwActive.flush()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cwActive)cwActive.flush()});
window.addEventListener('storage',e=>{if(e.key===CW_KEY)cwRefresh()});

  $("#view").innerHTML=q?results():VIEWS[view]();
  $("#view").style.overflowY=view==="shorts"&&!q?"hidden":"auto";
  if(view==="shorts"&&!q){const feed=$(".shorts");let timer;const activate=()=>{if(!feed.isConnected||document.hidden)return;const box=feed.getBoundingClientRect();let best=null,amount=0;feed.querySelectorAll(".sh").forEach(section=>{const r=section.getBoundingClientRect(),visible=Math.max(0,Math.min(r.bottom,box.bottom)-Math.max(r.top,box.top));if(visible>amount){amount=visible;best=section}});if(best&&amount>=box.height*0.5)startShort(best.querySelector("[data-short-play]"),true)};feed.addEventListener("scroll",()=>{clearTimeout(timer);timer=setTimeout(activate,150)},{passive:true});requestAnimationFrame(activate);}
  clearInterval(bt);
  if(view==="home"&&!q&&!matchMedia("(prefers-reduced-motion:reduce)").matches){
    bt=setInterval(()=>{const b=$("#bn");if(!b)return;const w=b.firstElementChild.offsetWidth+12;b.scrollTo({left:b.scrollLeft+w>=b.scrollWidth-w/2?0:b.scrollLeft+w,behavior:"smooth"})},5000);
  }
}
function stopShort(section){const frame=section.querySelector(".short-frame");frame.replaceChildren();frame.hidden=true;section.querySelector(".big").hidden=false;}
function startShort(button,automatic=false){
  if(!button)return;
  const section=button.closest(".sh"),feed=section.parentElement,c=SHORTS[+button.dataset.shortPlay];
  if(!section.querySelector(".short-frame").hidden)return;
  feed.querySelectorAll(".short-frame:not([hidden])").forEach(f=>stopShort(f.closest(".sh")));
  if(!c||(!c.youtube&&!c.tiktok)){toast("This short is not available yet");return;}
  $("#au").pause();$("#dock").classList.remove("on");
  const frame=section.querySelector(".short-frame"),iframe=document.createElement("iframe"),id=encodeURIComponent(c.youtube||c.tiktok);
  iframe.title=(c.caption||"Short")+" video player";
  iframe.allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
  iframe.allowFullscreen=true;iframe.referrerPolicy="strict-origin-when-cross-origin";
  frame.replaceChildren(iframe);frame.hidden=false;button.hidden=true;
  const status=section.querySelector(".short-status");status.textContent=" · If autoplay is blocked, tap play";
  if(c.tiktok){iframe.src="https://www.tiktok.com/player/v1/"+id+"?autoplay=1&loop=1&controls=1";return;}
  iframe.src="https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1&playsinline=1&rel=0&loop=1&playlist="+id+"&enablejsapi=1"+(/^https?:$/.test(location.protocol)?"&origin="+encodeURIComponent(location.origin):"");
  youtubeAPI.then(ready=>{
    if(!ready||!iframe.isConnected)return;
    try{new YT.Player(iframe,{events:{
      onReady:e=>{if(iframe.isConnected){e.target.unMute();e.target.playVideo()}},
      onAutoplayBlocked:()=>{if(iframe.isConnected)status.textContent=" · Autoplay with sound blocked. Tap play in the player"},
      onError:e=>{if(iframe.isConnected)status.textContent=(e.data===101||e.data===150)?" · Embedding unavailable. Open the original":e.data===100?" · Video unavailable. Open the original":" · Playback unavailable here. Open the original"}
    }});}catch(e){/* Keep the standard player and original link available. */}
  });
}
document.addEventListener("visibilitychange",()=>{if(document.hidden){document.querySelectorAll(".short-frame:not([hidden])").forEach(f=>stopShort(f.closest(".sh")))}else if(view==="shorts"&&!q){const feed=$(".shorts");if(feed)feed.dispatchEvent(new Event("scroll"))}});
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.id);toast.id=setTimeout(()=>t.style.display="none",3500)}
// Try sound first and let viewers play manually if autoplay is blocked.
let playerSession=0,hlsInst=null;
const killHls=()=>{if(hlsInst){try{hlsInst.destroy()}catch(e){}hlsInst=null}};
const youtubeAPI=new Promise(resolve=>{
  if(window.YT && window.YT.Player){resolve(true);return;}
  window.onYouTubeIframeAPIReady=()=>resolve(true);
  const script=document.createElement("script");script.src="https://www.youtube.com/iframe_api";
  script.onerror=()=>resolve(false);document.head.appendChild(script);
  setTimeout(()=>resolve(!!(window.YT && window.YT.Player)),10000);
});

// Only call things episodes when their titles explicitly identify the same series.
const seriesName=c=>{const m=(c.title||"").match(/^(.+?)\s*[·-]\s*(?:episode|show)\s+\d+\b/i);return m?m[1].trim().toLowerCase():""};
const playable=c=>!!(c.youtube||c.video||c.hls||c.channelId||c.frame||c.social||c.embed);
const coverFor=c=>c.cover||c.image||(c.youtube?"https://i.ytimg.com/vi/"+encodeURIComponent(c.youtube)+"/hqdefault.jpg":c.logo||"");
function preparePlayer(k,c){
  const dlg=$("#dlg"), cover=coverFor(c), image=$("#playerCover"), backdrop=$("#playerBackdrop");
  $("#playerTitle").textContent=c.title||c.name||c.caption||"WEST PULSE UG";
  $("#playerSub").textContent=c.sub||c.note||c.author||c.tag||"";
  image.hidden=!cover;if(cover){image.src=cover}else image.removeAttribute("src");
  backdrop.style.backgroundImage=cover?'url("'+cover.replace(/["\\]/g,"")+'")':"none";
  const container=$("#playerRelated");container.replaceChildren();
  const entries=[];let heading="";
  if(k[0]==="h"){
    heading="More channels";CHANNELS.forEach((item,i)=>{if("h"+i!==k&&playable(item))entries.push(["h"+i,item])});
  }else{
    const pool=[...CONTENT.map((item,i)=>["c"+i,item]),...TV_ARCHIVE.map((item,i)=>["a"+i,item]),...PODCASTS.map((item,i)=>["p"+i,item])];
    const series=seriesName(c);
    const episodes=series?pool.filter(([key,item])=>key!==k&&playable(item)&&seriesName(item)===series):[];
    if(episodes.length){heading="More episodes and shows";episodes.sort((a,b)=>{const number=x=>+(x.title.match(/(?:episode|show)\s+(\d+)/i)||[])[1];return number(b[1])-number(a[1])});entries.push(...episodes)}
    else if(c.cat){heading="More in "+c.cat;entries.push(...pool.filter(([key,item])=>key!==k&&playable(item)&&item.cat===c.cat).slice(0,12))}
    else if(k[0]==="a"){heading="More recorded TV";entries.push(...TV_ARCHIVE.map((item,i)=>["a"+i,item]).filter(([key,item])=>key!==k&&playable(item)).slice(0,12))}
    else if(k[0]==="p"){heading="More podcasts";entries.push(...PODCASTS.map((item,i)=>["p"+i,item]).filter(([key,item])=>key!==k&&playable(item)).slice(0,12))}
  }
  if(entries.length){
    const h=document.createElement("h3");h.className="related-heading";h.textContent=heading;container.appendChild(h);
    const list=document.createElement("div");list.className="related-list";
    entries.forEach(([key,item])=>{
      const button=document.createElement("button");button.className="related-item";button.dataset.p=key;
      const img=document.createElement("img");img.className="related-thumb";img.alt="";const src=coverFor(item);if(src)img.src=src;else img.hidden=true;
      const text=document.createElement("span"),title=document.createElement("strong"),sub=document.createElement("small");text.className="related-text";title.textContent=item.title||item.name||item.caption||"";sub.textContent=item.sub||item.note||item.author||"";text.append(title,sub);button.append(img,text);list.appendChild(button);
    });container.appendChild(list);
  }
  dlg.scrollTop=0;
}
function openPlayer(){const dlg=$("#dlg");if(!dlg.open)dlg.showModal()}

const EVENT_DETAILS={
  "Kasese Hikers End of Year Party":{description:"Kasese Hikers Club is hosting its end-of-year party at Isaazi Rooftop, Ngabu Hotel. The club says everyone is welcome, including people who are not hikers.",note:"The start time and entry price have not been confirmed.",source:"https://www.travelagents10.com/UG/Kasese/155304417655724/Kasese-Hikers-Club"},
  "Country Radio Launch · Rukungiri":{description:"Country Radio 87.6 FM celebrates its launch and the Boda Boda Festival finals. The programme includes music, wrestling, a free medical camp and prayers. The football final is at St Gerald’s Secondary School Nyakibale playground.",note:"Event information can change; check with the organisers before travelling.",source:"https://countryradiofm.com/2026/11/25/two-days-to-go-rukungiri-set-for-country-radio-87-6-fm-launch-and-boda-boda-festival-finals/"},
  "Rwenzori Marathon 2027":{description:"Run in Kasese with four distances: 42.2 km, 21.1 km, 10 km and 5 km. The full marathon starts at Kikorongo on the Equator; the other races start on Rwenzori Street. All finish at The Arena in Kasese.",note:"Check the official race information for registration, fees and confirmed start times.",source:"https://rwenzorimarathon.com/race-info"},
  "Mbarara Kids Fest":{description:"A family event with games, educational exhibitions and performances. A listing places it at Mbarara University Inn Grounds.",note:"Venue confirmation is recommended: another listing names a different venue for a similarly named event on the same day. Time and price have not been confirmed.",source:"https://prowesscomms.com/wp/mbarara-kids-fest/"},
  "Kisoro Nyama Festival":{description:"A Boxing Day celebration of food, music and culture at Mondi Lodge, Kisoro. The programme includes meat dishes, live cooking and DJ music.",note:"Tickets are reported to be on sale, but the price and start time have not been confirmed.",source:"https://www.showbizuganda.com/2026/11/kisoro-nyama-festival-set-to-transform-boxing-day-into-a-celebration-of-food-music-culture/"},
  "Explore Fort Portal":{description:"Discover Fort Portal and its surroundings, including Amabere Ga Nyinamwiru Caves, Tooro Kingdom Palace, crater lakes and nearby Kibale National Park.",note:"This is a destination guide, not a dated event.",source:"https://fortportalcity.go.ug/who-we-are/"}
};
function openEvent(b){
  const info=EVENT_DETAILS[b.title]||{description:b.tag,note:"",source:b.url};
  document.querySelector('#eventTitle').textContent=b.title;
  document.querySelector('#eventTag').textContent=b.tag;
  document.querySelector('#eventHeading').textContent=b.title==='Explore Fort Portal'?'Explore the area':'About this event';
  document.querySelector('#eventDescription').textContent=info.description;
  document.querySelector('#eventNote').textContent=info.note||'';
  const source=document.querySelector('#eventSource');source.href=info.source||b.url;source.hidden=!source.href;
  const hero=document.querySelector('#eventHero');hero.style.backgroundImage=b.image?`linear-gradient(0deg,rgba(0,0,0,.92),rgba(0,0,0,.15)),url("${b.image}")`:'linear-gradient(135deg,#563e08,#17171e)';
  const dlg=document.querySelector('#eventDlg');dlg.scrollTop=0;if(!dlg.open)dlg.showModal();
}
document.querySelector('#eventBack').addEventListener('click',()=>document.querySelector('#eventDlg').close());

function play(k){
  const c=SRC[k[0]]&&SRC[k[0]][+k.slice(1)];
  if(!c)return;
  if(k[0]==="b"){openEvent(c);return}
  cwStop();
  if(playable(c))preparePlayer(k,c);
  // The selected four live stations have no external fallback link, even on error.
  const existingLink=$("#youtubeLink");
  if(c.noOfficialLink){if(existingLink)existingLink.remove()}
  else if(!existingLink){
    const link=document.createElement("a");link.id="youtubeLink";link.target="_blank";link.rel="noopener noreferrer";link.textContent="Open the original source";
    $(".video-fallback p").appendChild(link);
  }
  const session=++playerSession;
  killHls();
  if(c.hls){
    $("#au").pause();$("#dock").classList.remove("on");
    const frame=$("#frame"),fallback=$(".video-fallback"),note=$("#playerNote");
    frame.classList.remove("audio-frame","social-frame");fallback.hidden=false;fallback.open=!!c.alwaysOfficial;
    note.className="player-note";note.textContent="Connecting to live stream…";
    if(!c.noOfficialLink)$("#youtubeLink").href=c.siteUrl||c.url||c.hls;
    const video=document.createElement("video");video.controls=true;video.playsInline=true;video.autoplay=true;video.setAttribute("aria-label",(c.name||"Live TV")+" live stream");
    frame.replaceChildren(video);
    const fail=()=>{if(session===playerSession){note.textContent="This stream is offline or blocked right now. Please try again later.";fallback.open=true}};
    video.addEventListener("playing",()=>{if(session===playerSession)note.textContent="Live · "+c.name});
    video.addEventListener("error",fail);
    if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=c.hls}
    else if(window.Hls&&Hls.isSupported()){
      hlsInst=new Hls({lowLatencyMode:true});
      hlsInst.on(Hls.Events.ERROR,(ev,d)=>{if(d&&d.fatal)fail()});
      hlsInst.loadSource(c.hls);hlsInst.attachMedia(video);
    }else{fail()}
    openPlayer();video.play().catch(()=>{if(session===playerSession)note.textContent="Tap play in the video to start."});return;
  }
  if(c.stream){
    // Direct radio stream: plays in the bottom player bar
    const au=$("#au");au.src=c.stream;au.play().catch(()=>toast("Station is offline right now"));
    $("#dt").textContent=c.name;$("#ds").textContent=c.note||"";$("#dock").classList.add("on");return;
  }
  if(c.video){
    $("#au").pause();$("#dock").classList.remove("on");
    const frame=$("#frame"),fallback=$(".video-fallback"),note=$("#playerNote");
    frame.classList.remove("audio-frame","social-frame");fallback.hidden=true;
    const video=document.createElement("video");video.controls=true;video.playsInline=true;video.preload="metadata";video.src=c.video;video.setAttribute("aria-label",c.title+" video player");frame.replaceChildren(video);
    note.className="player-note player-credit";note.replaceChildren(document.createTextNode("Silent footage · "+c.title+" by "+c.creator+" · converted to MP4. "));
    const source=document.createElement("a");source.href=c.source;source.target="_blank";source.rel="noopener noreferrer";source.textContent="Original";note.append(source,document.createTextNode(" · "));
    const license=document.createElement("a");license.href="https://creativecommons.org/licenses/by-sa/4.0/";license.target="_blank";license.rel="noopener noreferrer";license.textContent="CC BY-SA 4.0";note.append(license);
    cwVideo(cwId(k,c),video,session);
    video.addEventListener("error",()=>{if(session===playerSession)note.prepend(document.createTextNode("Video unavailable right now. "))});
    openPlayer();video.play().catch(()=>{if(session===playerSession)note.prepend(document.createTextNode("Tap play in the video to start. "))});return;
  }
  if(c.embed || c.social || c.channelId || c.youtube || c.frame){
    $("#au").pause();$("#dock").classList.remove("on");
    const frame=$("#frame"), fallback=$(".video-fallback"), noteEl=$("#playerNote");
    fallback.hidden=false;noteEl.className="player-note";frame.classList.toggle("audio-frame",!!c.embed);frame.classList.toggle("social-frame",!!c.social);
    fallback.open=!c.fallbackClosed&&!!(c.channelId||c.social||c.frame||c.alwaysOfficial);
    let src, original, note;
    const apiParams="&enablejsapi=1"+(/^https?:$/.test(location.protocol)?"&origin="+encodeURIComponent(location.origin):"");
    if(c.social){
      src="https://platform.twitter.com/embed/Tweet.html?id="+encodeURIComponent(c.social);original=c.url;note="Tap play in the post. If it does not load, open the original below.";
    }else if(c.embed){
      src=c.embed;original=c.url;note="Tap play to listen here.";
    }else if(c.channelId){
      src="https://www.youtube.com/embed/live_stream?channel="+encodeURIComponent(c.channelId)+"&autoplay=1&playsinline=1&rel=0"+apiParams;
      original=c.liveUrl;note="Available when the station is broadcasting live.";
    }else if(c.frame){
      src=c.frame;original=c.url;note=c.fallbackClosed?"Tap play in the video to start.":"Tap play on the station page. If it doesn't load here, use the link below.";
    }else{
      src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(c.youtube)+"?autoplay=1&playsinline=1&rel=0"+apiParams;
      original="https://www.youtube.com/watch?v="+encodeURIComponent(c.youtube);note=c.note||"";
    }
    const iframe=document.createElement("iframe");
    iframe.title=(c.title||c.name||c.caption||"WEST PULSE UG")+" player";
    iframe.allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
    iframe.referrerPolicy="strict-origin-when-cross-origin";iframe.allowFullscreen=true;
    frame.replaceChildren(iframe);noteEl.textContent=note;if(!c.noOfficialLink)$("#youtubeLink").href=original;
    const cw=cwYoutube(cwId(k,c),session);
    if(cw&&cw.saved)src+="&start="+Math.floor(cw.saved.time);
    openPlayer();iframe.src=src;
    if(!c.embed && !c.social && !c.frame) youtubeAPI.then(ready=>{
      if(!ready || session!==playerSession || !iframe.isConnected)return;
      let playing=false;
      try{new YT.Player(iframe,{events:{
        onReady:e=>{if(session===playerSession){if(cw)cw.ready(e.target);e.target.unMute();e.target.playVideo()}},
        onAutoplayBlocked:e=>{
          if(session!==playerSession)return;
          noteEl.textContent="Tap play in the video to start with sound. Check the speaker control if needed.";
        },
        onStateChange:e=>{
          if(session!==playerSession)return;
          if(cw)cw.state(e);
          if(e.data===YT.PlayerState.PLAYING){playing=true;noteEl.textContent=note;}
        },
        onError:e=>{if(session===playerSession){if(cw)cw.error(e.data);noteEl.textContent=c.channelId?"The station may be offline or may not allow playback here. Check its live page below.":"This video may be unavailable here. Try the original source below.";fallback.open=true;}}
      }});
      setTimeout(()=>{if(session===playerSession&&!playing&&!noteEl.textContent)noteEl.textContent="If playback is blocked, tap play in the video."},12000);
      }catch(e){/* The original iframe and source link remain available. */}
    });
    return;
  }
  if(c.url){window.open(c.url,"_blank","noopener,noreferrer");return;}
  if(c.audio){
    $("#au").src=c.audio;$("#au").play().catch(()=>{});
    $("#dt").textContent=c.title;$("#ds").textContent=c.sub||"";$("#dock").classList.add("on");
  }else toast(k[0]==="h"?"Stream not available yet":"This video is not available yet");
}
const closeVideo=()=>{cwStop();playerSession++;killHls();$("#dlg").close();$("#frame").innerHTML="";cwRefresh()};

/* chrome */
$("nav").innerHTML=Object.keys(TITLES).map(v=>`<button data-v="${v}">${svg(P[v])}<span>${TITLES[v]}</span></button>`).join("");
$("#sb").innerHTML=svg(P.search,30);
$("#me").innerHTML=svg(P.user,24);

document.addEventListener("click",e=>{
  const t=e.target,g=s=>t.closest(s);
  let n;
  if(n=g("[data-cw-remove]")){try{cwRemove(decodeURIComponent(n.dataset.cwRemove));cwRefresh()}catch(e){}}
  else if(n=g("[data-short-play]")){startShort(n)}
  else if(n=g("[data-short-move]")){const section=n.closest(".sh"),next=n.dataset.shortMove==="1"?section.nextElementSibling:section.previousElementSibling;if(next)next.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}
  else if(n=g("[data-radio]")){view="more";sub="radio";q="";$("#q").value="";$("#sbar").classList.remove("on");render()}
  else if(n=g("[data-v]")){view=n.dataset.v;q="";$("#q").value="";$("#sbar").classList.remove("on");render()}
  else if(n=g("[data-c]")){videoExpanded=!!n.closest(".category-shelf");cat=n.dataset.c;render();const section=$(videoExpanded?"#category-heading":"#entertainment");if(section)section.scrollIntoView({block:"start"})}
  else if(n=g("[data-video-more]")){videoExpanded=!videoExpanded;render();const section=$("#category-heading");if(section)section.scrollIntoView({block:"start"})}
  else if(n=g("[data-st]")){sub=n.dataset.st;render()}
  else if(n=g("[data-a]")){
    const a=n.dataset.a;
    if(a==="like"||a==="dis"){const on=n.getAttribute("aria-pressed")!=="true";n.parentElement.querySelectorAll("[aria-pressed]").forEach(b=>b.setAttribute("aria-pressed","false"));n.setAttribute("aria-pressed",on)}
    else if(a==="add")toast("Added to your list");
    else (navigator.share?navigator.share({title:"WEST PULSE UG",url:location.href}).catch(()=>{}):toast("Copy the page link to share"));
  }
  else if(n=g("[data-p]"))play(n.dataset.p);
  else if(g("#sb")){const b=$("#sbar");b.classList.toggle("on");if(b.classList.contains("on"))$("#q").focus()}
  else if(g("#me"))toast("Sign-in is coming soon");
});
$("#q").addEventListener("input",e=>{q=e.target.value.trim();render()});
$("#x").addEventListener("click",closeVideo);
$("#dlg").addEventListener("cancel",()=>{cwStop();playerSession++;killHls();$("#frame").innerHTML="";cwRefresh()});
render();
</script>
