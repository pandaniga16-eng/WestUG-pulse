const poster=(c,k)=>`<button class="po" data-p="${k}"><div class="pi" style="background:${c.cover?`linear-gradient(0deg,rgba(0,0,0,.88),transparent 75%),url('${c.cover}') center/cover`:c.youtube?`linear-gradient(0deg,rgba(0,0,0,.88),transparent 75%),url(https://i.ytimg.com/vi/${c.youtube}/hqdefault.jpg) center/cover`:grad(c.hue)}">${c.title}</div><small>${c.sub}</small></button>`;
const rowItem=(k,lg,name,sub2)=>`<button class="li" data-p="${k}">${lg}<span class="n">${name}${sub2?`<small>${sub2}</small>`:""}</span>${svg(P.chev,22)}</button>`;
const initials=n=>n.split(" ").map(w=>w[0]).join("").slice(0,3);
const chLogo=c=>`<div class="lg" style="background:${c.color}">${initials(c.name)}${c.logo?`<img src="${c.logo}" alt="${c.name} logo" loading="lazy" onerror="this.remove()">`:""}</div>`;
const channelCard=(c,i)=>`<div class="station"><button class="channel-card" data-p="h${i}" aria-label="Watch ${c.name} here">${c.cover?`<img class="channel-cover" src="${c.cover}" alt="" loading="lazy" onerror="this.remove()">`:""}<span class="channel-info">${chLogo(c)}<span><strong>${c.name}</strong><small>${c.note}</small><small>Tap to watch here</small></span></span></button></div>`;
const thumb=c=>`<div class="lg" style="background:${c.youtube?`url(https://i.ytimg.com/vi/${c.youtube}/hqdefault.jpg) center/cover`:grad(c.hue)}">${c.youtube?"":c.title.charAt(0)}</div>`;

const VIDEO_PAGE_SIZE=20;
function videoGrid(){
  const items=CONTENT.map((c,i)=>({c,i})).filter(({c})=>c.cat===cat&&(c.video||c.youtube||c.audio||c.embed||c.social));
  if(!items.length)return `<div class="row"><p class="empty">No playable shows here yet.</p></div>`;
  const current=items.slice(0,(videoPage+1)*VIDEO_PAGE_SIZE);
  return `<div class="row">${current.map(({c,i})=>poster(c,"c"+i)).join("")}</div>${current.length<items.length?`<div class="video-pages"><button data-video-more aria-label="Show more videos in ${cat}">More</button></div>`:""}`;
}
const EXPLORE_VIDEOS=[
 {title:'Rwenzori Mountains',creator:'Johannes Gruenwald',youtube:'N9JR3LrcuZ0'},
 {title:'Kazinga Channel boat safari',creator:'MAHO on Earth',youtube:'cy6KdF4umyQ'},
 {title:'Fort Portal road trip',creator:'Buba',youtube:'059iY5ExXjU'},
 {title:'Sempaya Hot Springs',creator:'East Africa Travel Podcast | Diary of a Muzungu',youtube:'M3vYiyjTKrc'},
 {title:'Kibale chimpanzees',creator:'Rand Blimes',youtube:'PvDmVmahPhA'},
 {title:'Lake Bunyonyi boat tour',creator:'Rose Basemera',youtube:'JJ9_Mf5SGPs'}
];
const exploreNative=c=>`<article class="explore-video"><video class="explore-autoplay" controls muted playsinline loop preload="metadata" src="${c.video}" aria-label="${c.title} video"></video><strong>${c.title}</strong><small>Silent footage · <a href="${c.source}" target="_blank" rel="noopener noreferrer">${c.creator} · original</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a></small></article>`;
const exploreEmbed=c=>`<article class="explore-video"><iframe class="explore-autoplay" data-src="https://www.youtube-nocookie.com/embed/${c.youtube}?autoplay=1&amp;mute=1&amp;playsinline=1&amp;rel=0&amp;loop=1&amp;playlist=${c.youtube}" title="${c.title} video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><strong>${c.title}</strong><small>Video: ${c.creator} · <a href="https://www.youtube.com/watch?v=${c.youtube}" target="_blank" rel="noopener noreferrer">Open original</a></small></article>`;
let exploreObserver;
function setupExploreAutoplay(){
 if(exploreObserver)exploreObserver.disconnect();
 const players=document.querySelectorAll('.explore-autoplay');
 const toggle=(el,on)=>{if(el.tagName==='VIDEO'){if(on)el.play().catch(()=>{});else el.pause()}else if(on){if(!el.hasAttribute('src'))el.src=el.dataset.src}else el.removeAttribute('src')};
 if(!('IntersectionObserver' in window)){players.forEach(el=>toggle(el,true));return}
 exploreObserver=new IntersectionObserver(entries=>entries.forEach(e=>toggle(e.target,e.isIntersecting)),{root:document.querySelector('#view'),threshold:0.3});players.forEach(el=>exploreObserver.observe(el));
}
const VIEWS={
 home:()=>`<div class="banners" id="bn">${BANNERS.map((b,i)=>`<button class="bn" data-p="b${i}" style="background:${b.image?`linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.25)),url('${b.image}') center/cover`:grad(b.hue)}"><h2>${b.title}</h2><span class="tag">${b.tag}</span><span class="cta">${b.cta}</span><small class="banner-credit">${b.credit||""}</small></button>`).join("")}</div>
  <h2 class="sec">Explore Western Uganda</h2><p class="explore-note">Videos play muted as you scroll. Tap the player for sound. If a video does not play, open the original.</p><div class="row feature-grid">${CONTENT.slice(0,2).map(exploreNative).join("")}${EXPLORE_VIDEOS.map(exploreEmbed).join("")}</div>
  <h2 class="sec">Western DJ mixes</h2><div class="row feature-grid">${CONTENT.slice(2,8).map((c,i)=>poster(c,"c"+(i+2))).join("")}</div>
  <h2 class="sec">Entertainment</h2>
  <div class="pills">${CATS.map(c=>`<button class="pill${c===cat?" on":""}" data-c="${c}">${c}</button>`).join("")}</div>
  ${videoGrid()}
  <button class="feature" data-v="channels"><span>WEST PULSE UG<br>TV<small>Recorded TV & channels</small></span></button>`,
 channels:()=>`<div class="channel-list">${CHANNELS.length?CHANNELS.map(channelCard).join(""):`<p class="empty">No verified live streams available yet. Find recorded shows in More → TV archive.</p>`}</div>`,
 guide:()=>`<div class="guide-wrap"><h2>TV Guide</h2><p>Explore programmes from each station here. Broadcast days and times have not been confirmed, and programmes may change.</p>
 <section class="guide-card"><h3>TV West</h3><ul class="guide-programmes"><li><strong>Sisimuka</strong><small>TV West programme</small></li><li><strong>Omushongi</strong><small>Lunch-time request show</small></li><li><strong>Omubabiro</strong><small>TV West programme</small></li><li><strong>Omuneneserezo</strong><small>Contemporary music</small></li><li><strong>Agacencwire</strong><small>News</small></li><li><strong>Age’ihangwe</strong><small>National news</small></li><li><strong>Ankole Actors</strong><small>Local comedy</small></li><li><strong>Tuhanuure</strong><small>Talk show</small></li></ul><button class="guide-watch" data-p="a0">▶ Watch an Agacencwire recording here</button></section>
 <section class="guide-card"><h3>Rwenzori TV</h3><ul class="guide-programmes"><li><strong>Bwakere Rwenzori</strong><small>Rwenzori TV programme</small></li><li><strong>Corridors of Power</strong><small>Rwenzori TV programme</small></li></ul><button class="guide-watch" data-p="a6">▶ Watch a Bwakere Rwenzori recording here</button></section>
 <section class="guide-card"><h3>UBC Television</h3><ul class="guide-programmes"><li><strong>Good Morning Uganda</strong><small>Morning news and discussion</small></li><li><strong>Good Morning Uganda Extra</strong><small>Interviews and discussion</small></li><li><strong>UBC News Tonight</strong><small>News bulletin</small></li><li><strong>UBC Leero</strong><small>Luganda news</small></li><li><strong>Buuza Kamisona</strong><small>Tax education</small></li></ul></section><h3>Watch recorded TV</h3><p>Catch up on recordings from the archive.</p><div class="list">${[0,1,4,6].map(i=>rowItem('a'+i,thumb(TV_ARCHIVE[i]),TV_ARCHIVE[i].title,TV_ARCHIVE[i].sub)).join('')}</div></div>`,
 more:()=>`<div class="subtabs">${[["archive","TV archive"],["pod","Podcasts"],["about","About"]].map(t=>`<button class="st${sub===t[0]?" on":""}" data-st="${t[0]}">${t[1]}</button>`).join("")}</div><div class="list">${
  sub==="archive"?TV_ARCHIVE.map((c,i)=>rowItem("a"+i,thumb(c),c.title,c.sub)).join("")
  :sub==="pod"?`<p class="pod-intro">Podcasts &amp; interviews from Western Uganda and beyond. Tap an episode to play it here when available.</p>`+PODCASTS.map((c,i)=>rowItem("p"+i,thumb(c),c.title,c.sub)).join("")
  :`<div class="about-page"><h2>About WEST PULSE UG</h2><p>WEST PULSE UG brings Western Uganda’s music, entertainment, conversations and TV together in one place.</p><p>Explore music, films, Shorts, podcasts and interviews, plus TV West, Rwenzori TV and UBC Television. Visit the TV archive for recorded programmes and the TV Guide for station updates.</p><p>Videos and other media are provided by their original creators and stations. Availability and live broadcasts depend on the source. If a player cannot start, open the help in the player for the original source.</p></div>`}</div>`,
 shorts:()=>`<div class="shorts">${SHORTS.map((s,i)=>`<section class="sh" style="background:${s.youtube?`linear-gradient(0deg,rgba(0,0,0,.9),rgba(0,0,0,.15) 70%),url(https://i.ytimg.com/vi/${s.youtube}/hqdefault.jpg) center/cover`:grad(s.hue)}"><button class="big" data-short-play="${i}" aria-label="Play short"><i>${svg(P.play,40)}</i></button><div class="short-frame" hidden></div><div class="short-nav"><button data-short-move="-1" aria-label="Previous short" ${i===0?"disabled":""}>↑</button><button data-short-move="1" aria-label="Next short" ${i===SHORTS.length-1?"disabled":""}>↓</button></div><span class="short-tip">Swipe up for more</span><p>${s.caption}</p><div class="who"><i></i>${s.author}</div><div class="short-source">YouTube · <a href="https://www.youtube.com/watch?v=${encodeURIComponent(s.youtube)}" target="_blank" rel="noopener noreferrer">Open original if playback fails</a><span class="short-status"> · If autoplay is blocked, tap play</span></div>
  <div class="act"><button data-a="like" aria-pressed="false" aria-label="Like">${svg(P.up,34)}</button><button data-a="dis" aria-pressed="false" aria-label="Dislike" style="transform:scaleY(-1)">${svg(P.up,34)}</button><button data-a="add" aria-label="Add to my list">${svg(P.plus,38)}</button><button data-a="share" aria-label="Share">${svg(P.share,34)}</button></div></section>`).join("")}</div>`
};

function results(){
  const t=q.toLowerCase();
  const hit=[...CONTENT.map((c,i)=>(c.video||c.youtube||c.audio||c.embed||c.social)?["c"+i,thumb(c),c.title,c.cat,c.title]:null).filter(Boolean),...CHANNELS.map((c,i)=>["h"+i,chLogo(c),c.name,"Channel",c.name]),...TV_ARCHIVE.map((c,i)=>["a"+i,thumb(c),c.title,c.sub,c.title]),...PODCASTS.map((c,i)=>["p"+i,thumb(c),c.title,"Podcast",c.title])].filter(x=>x[4].toLowerCase().includes(t));
  return hit.length?`<div class="list">${hit.map(x=>rowItem(x[0],x[1],x[2],x[3])).join("")}</div>`:`<p class="empty">Nothing matches "${q}". Try another word.</p>`;
}
function render(){
  $("#title").textContent=TITLES[view];
  document.querySelectorAll("nav button").forEach(b=>{const on=b.dataset.v===view;b.classList.toggle("on",on);on?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current")});
  $("#view").innerHTML=q?results():VIEWS[view]();
  setupExploreAutoplay();
  $("#view").style.overflowY=view==="shorts"&&!q?"hidden":"auto";
  if(view==="shorts"&&!q){const feed=$(".shorts");let timer;const activate=()=>{if(!feed.isConnected||document.hidden)return;const box=feed.getBoundingClientRect();let best=null,amount=0;feed.querySelectorAll(".sh").forEach(section=>{const r=section.getBoundingClientRect(),visible=Math.max(0,Math.min(r.bottom,box.bottom)-Math.max(r.top,box.top));if(visible>amount){amount=visible;best=section}});if(best&&amount>=box.height*0.5)startShort(best.querySelector("[data-short-play]"),true)};feed.addEventListener("scroll",()=>{clearTimeout(timer);timer=setTimeout(activate,150)},{passive:true});requestAnimationFrame(activate);}
  clearInterval(bt);
  if(view==="home"&&!q&&!matchMedia("(prefers-reduced-motion:reduce)").matches){
    bt=setInterval(()=>{const b=$("#bn");if(!b)return;const w=b.firstElementChild.offsetWidth+12;b.scrollTo({left:b.scrollLeft+w>=b.scrollWidth-w/2?0:b.scrollLeft+w,behavior:"smooth"})},5000);
  }
}
function stopShort(section){const frame=section.querySelector(".short-frame");frame.replaceChildren();frame.hidden=true;section.querySelector(".big").hidden=false;}
function startShort(button,automatic=false){
  if(!button)return;
  const section=button.closest(".sh"),feed=section.parentElement,c=SHORTS[+button.dataset.shortPlay];
  if(!section.querySelector(".short-frame").hidden)return;
  feed.querySelectorAll(".short-frame:not([hidden])").forEach(f=>stopShort(f.closest(".sh")));
  if(!c||!c.youtube){toast("This short is not available yet");return;}
  $("#au").pause();$("#dock").classList.remove("on");
  const frame=section.querySelector(".short-frame"),iframe=document.createElement("iframe"),id=encodeURIComponent(c.youtube);
  iframe.title=(c.caption||"Short")+" video player";
  iframe.allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
  iframe.allowFullscreen=true;iframe.referrerPolicy="strict-origin-when-cross-origin";
  frame.replaceChildren(iframe);frame.hidden=false;button.hidden=true;
  const status=section.querySelector(".short-status");status.textContent=" · If autoplay is blocked, tap play";
  iframe.src="https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1&playsinline=1&rel=0&loop=1&playlist="+id+"&enablejsapi=1"+(/^https?:$/.test(location.protocol)?"&origin="+encodeURIComponent(location.origin):"");
  youtubeAPI.then(ready=>{
    if(!ready||!iframe.isConnected)return;
    try{new YT.Player(iframe,{events:{
      onReady:e=>{if(iframe.isConnected){e.target.unMute();e.target.playVideo()}},
      onAutoplayBlocked:()=>{if(iframe.isConnected)status.textContent=" · Autoplay with sound blocked. Tap play in the player"},
      onError:e=>{if(iframe.isConnected)status.textContent=(e.data===101||e.data===150)?" · Embedding unavailable. Open the original":e.data===100?" · Video unavailable. Open the original":" · Playback unavailable here. Open the original"}
    }});}catch(e){/* Keep the standard player and original link available. */}
  });
}
document.addEventListener("visibilitychange",()=>{if(document.hidden){document.querySelectorAll(".short-frame:not([hidden])").forEach(f=>stopShort(f.closest(".sh")))}else if(view==="shorts"&&!q){const feed=$(".shorts");if(feed)feed.dispatchEvent(new Event("scroll"))}});
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.id);toast.id=setTimeout(()=>t.style.display="none",3500)}
// Try sound first and let viewers play manually if autoplay is blocked.
let playerSession=0;
const youtubeAPI=new Promise(resolve=>{
  if(window.YT && window.YT.Player){resolve(true);return;}
  window.onYouTubeIframeAPIReady=()=>resolve(true);
  const script=document.createElement("script");script.src="https://www.youtube.com/iframe_api";
  script.onerror=()=>resolve(false);document.head.appendChild(script);
  setTimeout(()=>resolve(!!(window.YT && window.YT.Player)),10000);
});
function play(k){
  const c=SRC[k[0]][+k.slice(1)];
  const session=++playerSession;
  if(c.video){
    $("#au").pause();$("#dock").classList.remove("on");
    const frame=$("#frame"),fallback=$(".video-fallback"),note=$("#playerNote");
    frame.classList.remove("audio-frame","social-frame");fallback.hidden=true;
    const video=document.createElement("video");video.controls=true;video.playsInline=true;video.preload="metadata";video.src=c.video;video.setAttribute("aria-label",c.title+" video player");frame.replaceChildren(video);
    note.className="player-note player-credit";note.replaceChildren(document.createTextNode("Silent footage · "+c.title+" by "+c.creator+" · converted to MP4. "));
    const source=document.createElement("a");source.href=c.source;source.target="_blank";source.rel="noopener noreferrer";source.textContent="Original";note.append(source,document.createTextNode(" · "));
    const license=document.createElement("a");license.href="https://creativecommons.org/licenses/by-sa/4.0/";license.target="_blank";license.rel="noopener noreferrer";license.textContent="CC BY-SA 4.0";note.append(license);
    video.addEventListener("error",()=>{if(session===playerSession)note.prepend(document.createTextNode("Video unavailable right now. "))});
    $("#dlg").showModal();video.play().catch(()=>{});return;
  }
  if(c.embed || c.social || c.channelId || c.youtube){
    $("#au").pause();$("#dock").classList.remove("on");
    const frame=$("#frame"), fallback=$(".video-fallback"), noteEl=$("#playerNote");
    fallback.hidden=false;noteEl.className="player-note";frame.classList.toggle("audio-frame",!!c.embed);frame.classList.toggle("social-frame",!!c.social);
    fallback.open=!!(c.channelId||c.social);
    let src, original, note;
    const apiParams="&enablejsapi=1"+(/^https?:$/.test(location.protocol)?"&origin="+encodeURIComponent(location.origin):"");
    if(c.social){
      src="https://platform.twitter.com/embed/Tweet.html?id="+encodeURIComponent(c.social);original=c.url;note="Tap play in the post. If it does not load, open the original below.";
    }else if(c.embed){
      src=c.embed;original=c.url;note="Tap play to listen here.";
    }else if(c.channelId){
      src="https://www.youtube.com/embed/live_stream?channel="+encodeURIComponent(c.channelId)+"&autoplay=1&playsinline=1&rel=0"+apiParams;
      original=c.liveUrl;note="Available when the station is broadcasting live.";
    }else{
      src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(c.youtube)+"?autoplay=1&playsinline=1&rel=0&loop=1&playlist="+encodeURIComponent(c.youtube)+apiParams;
      original="https://www.youtube.com/watch?v="+encodeURIComponent(c.youtube);note=c.note||"";
    }
    const iframe=document.createElement("iframe");
    iframe.title=(c.title||c.name||c.caption||"WEST PULSE UG")+" player";
    iframe.allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
    iframe.referrerPolicy="strict-origin-when-cross-origin";iframe.allowFullscreen=true;
    frame.replaceChildren(iframe);noteEl.textContent=note;$("#youtubeLink").href=original;
    $("#dlg").showModal();iframe.src=src;
    if(!c.embed && !c.social) youtubeAPI.then(ready=>{
      if(!ready || session!==playerSession || !iframe.isConnected)return;
      let playing=false;
      try{new YT.Player(iframe,{events:{
        onReady:e=>{if(session===playerSession){e.target.unMute();e.target.playVideo()}},
        onAutoplayBlocked:e=>{
          if(session!==playerSession)return;
          noteEl.textContent="Tap play in the video to start with sound. Check the speaker control if needed.";
        },
        onStateChange:e=>{
          if(session!==playerSession)return;
          if(e.data===YT.PlayerState.PLAYING){playing=true;noteEl.textContent=note;}
        },
        onError:()=>{if(session===playerSession){noteEl.textContent=c.channelId?"The station may be offline or may not allow playback here. Check its live page below.":"This video may be unavailable here. Try the original source below.";fallback.open=true;}}
      }});
      setTimeout(()=>{if(session===playerSession&&!playing&&!noteEl.textContent)noteEl.textContent="If playback is blocked, tap play in the video."},12000);
      }catch(e){/* The original iframe and source link remain available. */}
    });
    return;
  }
  if(c.url){window.open(c.url,"_blank","noopener,noreferrer");return;}
  if(c.audio){
    $("#au").src=c.audio;$("#au").play().catch(()=>{});
    $("#dt").textContent=c.title;$("#ds").textContent=c.sub||"";$("#dock").classList.add("on");
  }else toast(k[0]==="h"?"Stream not available yet":"This video is not available yet");
}
const closeVideo=()=>{playerSession++;$("#dlg").close();$("#frame").innerHTML=""};

/* chrome */
$("nav").innerHTML=Object.keys(TITLES).map(v=>`<button data-v="${v}">${svg(P[v])}<span>${TITLES[v]}</span></button>`).join("");
$("#sb").innerHTML=svg(P.search,30);
$("#me").innerHTML=svg(P.user,24);

document.addEventListener("click",e=>{
  const t=e.target,g=s=>t.closest(s);
  let n;
  if(n=g("[data-short-play]")){startShort(n)}
  else if(n=g("[data-short-move]")){const section=n.closest(".sh"),next=n.dataset.shortMove==="1"?section.nextElementSibling:section.previousElementSibling;if(next)next.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}
  else if(n=g("[data-v]")){view=n.dataset.v;q="";$("#q").value="";$("#sbar").classList.remove("on");render()}
  else if(n=g("[data-c]")){cat=n.dataset.c;videoPage=0;render()}
  else if(n=g("[data-video-more]")){const top=$("#view").scrollTop;videoPage++;render();$("#view").scrollTop=top}
  else if(n=g("[data-st]")){sub=n.dataset.st;render()}
  else if(n=g("[data-a]")){
    const a=n.dataset.a;
    if(a==="like"||a==="dis"){const on=n.getAttribute("aria-pressed")!=="true";n.parentElement.querySelectorAll("[aria-pressed]").forEach(b=>b.setAttribute("aria-pressed","false"));n.setAttribute("aria-pressed",on)}
    else if(a==="add")toast("Added to your list");
    else (navigator.share?navigator.share({title:"WEST PULSE UG",url:location.href}).catch(()=>{}):toast("Copy the page link to share"));
  }
  else if(n=g("[data-p]"))play(n.dataset.p);
  else if(g("#sb")){const b=$("#sbar");b.classList.toggle("on");if(b.classList.contains("on"))$("#q").focus()}
  else if(g("#me"))toast("Sign-in is coming soon");
});
$("#q").addEventListener("input",e=>{q=e.target.value.trim();render()});
$("#x").addEventListener("click",closeVideo);
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")closeVideo()});
$("#dlg").addEventListener("cancel",()=>{playerSession++;$("#frame").innerHTML=""});
render();
</script>
